<!DOCTYPE html>

<head>

    <style>
/* =========================================================
   ManguiTrack · sistema de diseño
   ========================================================= */
:root {
    --bg: #f3f6f1;
    --surface: #ffffff;
    --surface-2: #f7f9f5;
    --text: #1c2a20;
    --muted: #6a786c;
    --border: #e1e8de;
    --primary: #2f6b3c;
    --primary-hover: #255631;
    --accent: #e08a00;
    --ok: #2e7d32;
    --warn: #b26a00;
    --danger: #c0392b;
    --info: #2563a6;
    --purple: #6d4bb5;
    --shadow: 0 10px 30px rgba(25, 55, 32, .08);
    --radius: 14px;
}

@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
        --bg: #111913;
        --surface: #1a241d;
        --surface-2: #202c24;
        --text: #edf3eb;
        --muted: #a0afa1;
        --border: #304034;
        --primary: #5aa86a;
        --primary-hover: #6cbd7e;
        --accent: #f0ad3c;
        --ok: #7bc67e;
        --warn: #e8a94f;
        --danger: #f08078;
        --info: #79b4ef;
        --purple: #b39ae8;
        --shadow: 0 10px 30px rgba(0, 0, 0, .3);
    }
}

:root[data-theme="dark"] {
    --bg: #111913;
    --surface: #1a241d;
    --surface-2: #202c24;
    --text: #edf3eb;
    --muted: #a0afa1;
    --border: #304034;
    --primary: #5aa86a;
    --primary-hover: #6cbd7e;
    --accent: #f0ad3c;
    --ok: #7bc67e;
    --warn: #e8a94f;
    --danger: #f08078;
    --info: #79b4ef;
    --purple: #b39ae8;
    --shadow: 0 10px 30px rgba(0, 0, 0, .3);
}

* { box-sizing: border-box; }
html { scroll-padding-top: 12px; }
body {
    margin: 0;
    display: block;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 "Inter", "Segoe UI", Roboto, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { margin: 0; line-height: 1.2; }
h1 { font-size: 24px; letter-spacing: -.4px; }
h2 { font-size: 15px; }
h3 { font-size: 14px; margin: 16px 0 8px; }
p { margin: 0; }
small { font-size: 12px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- Estructura ---------- */
.app-header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    box-shadow: 0 2px 12px rgba(25, 55, 32, .04);
}
.header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 10px 24px;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark {
    width: 34px; height: 34px;
    display: grid; place-items: center;
    background: linear-gradient(135deg, var(--primary), #6ba64f);
    border-radius: 10px;
    color: #fff;
    font-size: 17px;
    font-weight: 800;
}
.brand strong { display: block; font-size: 15px; }
.brand small { color: var(--muted); }
.header-actions { display: flex; align-items: center; gap: 8px; }
.current-page {
    padding: 5px 11px;
    border-radius: 20px;
    background: var(--surface-2);
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
}
.topnav {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
    padding: 0 24px 8px;
}
.nav-group { position: relative; flex: none; }
.nav-group:hover, .nav-group:focus-within { z-index: 2; }
.nav-trigger {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    border: 1px solid transparent;
    border-radius: 8px;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
    transition: background .15s, color .15s;
}
.nav-trigger:hover, .nav-group:focus-within > .nav-trigger { background: var(--surface-2); }
.nav-group.active > .nav-trigger { color: var(--primary); }
.nav-caret {
    width: 0; height: 0;
    border-left: 4px solid transparent;
    border-right: 4px solid transparent;
    border-top: 5px solid currentColor;
    opacity: .65;
    transition: transform .15s;
}
.nav-group:hover > .nav-trigger .nav-caret,
.nav-group:focus-within > .nav-trigger .nav-caret { transform: rotate(180deg); }
.nav-menu {
    display: none;
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    min-width: 190px;
    padding: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: var(--shadow);
    z-index: 30;
}
.nav-menu::before {
    content: "";
    position: absolute;
    top: -8px; left: 0; right: 0;
    height: 8px;
}
.nav-group:hover > .nav-menu,
.nav-group:focus-within > .nav-menu { display: block; }
.nav-item {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 8px 10px;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 12px;
    text-align: left;
    white-space: nowrap;
    cursor: pointer;
    transition: background .15s, color .15s;
}
.nav-item:hover { background: var(--surface-2); }
.nav-item.active { background: var(--primary); color: #fff; font-weight: 600; }
.nav-count {
    min-width: 18px;
    padding: 0 5px;
    border-radius: 20px;
    background: var(--accent);
    color: #241800;
    font-size: 10px;
    font-weight: 700;
    text-align: center;
}
.content { padding: 20px 24px 32px; max-width: 1500px; margin: 0 auto; }
.section-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 16px;
}
.section-head p { color: var(--muted); margin-top: 4px; }
.head-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- Componentes ---------- */
.card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px;
    margin-bottom: 18px;
}
.card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
}
.card-head h2 { font-size: 15px; }
.link { border: 0; background: none; color: var(--primary); font: inherit; font-weight: 600; cursor: pointer; }
.link:hover { text-decoration: underline; }
.muted { color: var(--muted); }
.hint { color: var(--muted); }

.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 9px 14px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--surface-2);
    color: var(--text);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: filter .15s, transform .1s;
    white-space: nowrap;
}
.btn:hover { filter: brightness(.96); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn.ghost { background: transparent; }
.btn.sm { padding: 6px 10px; font-size: 12px; }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.danger-ghost { background: transparent; border-color: var(--danger); color: var(--danger); }
.icon-btn {
    min-width: 30px; height: 30px;
    display: inline-flex; align-items: center; justify-content: center;
    padding: 0 7px;
    border: 1px solid transparent;
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 12px;
    white-space: nowrap;
    cursor: pointer;
}
.icon-btn:hover { background: var(--surface-2); color: var(--text); border-color: var(--border); }
.icon-btn.danger:hover { color: var(--danger); }

.badge {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 20px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
}
.badge.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, var(--border)); background: color-mix(in srgb, var(--ok) 10%, var(--surface)); }
.badge.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, var(--border)); background: color-mix(in srgb, var(--warn) 10%, var(--surface)); }
.badge.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, var(--border)); background: color-mix(in srgb, var(--danger) 10%, var(--surface)); }
.badge.info { color: var(--info); border-color: color-mix(in srgb, var(--info) 40%, var(--border)); background: color-mix(in srgb, var(--info) 10%, var(--surface)); }
.badge.purple { color: var(--purple); border-color: color-mix(in srgb, var(--purple) 40%, var(--border)); background: color-mix(in srgb, var(--purple) 10%, var(--surface)); }
.badge.soft { font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 4px 9px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); font-size: 12px; }
.chip.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, var(--border)); }

.kpi-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 18px; }
.kpi-grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.kpi {
    display: flex; align-items: center; gap: 14px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow);
}
.kpi span { display: block; color: var(--muted); font-size: 12px; }
.kpi strong { display: block; font-size: 22px; letter-spacing: -.5px; }
.kpi small { color: var(--muted); }
.two-col { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.two-col .card { margin-bottom: 0; }

.list { display: flex; flex-direction: column; }
.list-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 0; border-bottom: 1px solid var(--border);
}
.list-row:last-child { border-bottom: 0; }
.list-row strong { display: block; font-size: 13px; }
.list-row small { display: block; color: var(--muted); margin-top: 2px; }
.nowrap { white-space: nowrap; }

.toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.search, .filter-select, .field input, .field select, .field textarea, .qty-input {
    width: 100%;
    padding: 9px 11px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--surface);
    color: var(--text);
    font: inherit;
}
.search { max-width: 380px; }
.filter-select { max-width: 190px; }
.qty-input { width: 74px; padding: 5px 7px; }
textarea { resize: vertical; }

.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th {
    position: sticky; top: 0;
    background: var(--surface-2);
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .5px;
    text-align: left;
    padding: 10px 12px;
    white-space: nowrap;
}
tbody td { padding: 10px 12px; border-top: 1px solid var(--border); vertical-align: middle; }
tbody tr:hover { background: var(--surface-2); }
td.right, th.right { text-align: right; }
td.low { color: var(--danger); font-weight: 700; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; color: var(--muted); }
.row-actions { white-space: nowrap; text-align: right; }
.mini-table { margin: 10px 0; }
.mini-table th, .mini-table td { padding: 7px 9px; }

.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.form-grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.form-grid.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.field { display: flex; flex-direction: column; gap: 5px; }
.field.full, .form-grid .full { grid-column: 1 / -1; }
.field label { font-size: 12px; font-weight: 600; color: var(--muted); }
.field small { color: var(--muted); }
.field.align-end { justify-content: flex-end; }
.form-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.form-actions.end { justify-content: flex-end; }
.stack { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }

.cart-box { margin-top: 14px; border: 1px dashed var(--border); border-radius: 10px; padding: 12px; }
.cart-box .table-wrap { border: 0; }
.cart-empty { color: var(--muted); padding: 12px; text-align: center; }
.cart-total { display: flex; justify-content: flex-end; gap: 16px; align-items: center; padding: 10px 12px; font-size: 16px; }
.cart-total span { color: var(--muted); }

.route-result { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 16px; }
.route-card { border: 1px solid var(--border); border-radius: 10px; padding: 12px; background: var(--surface-2); }
.route-card h3 { margin: 0 0 8px; }
.route-card .path { color: var(--muted); margin-bottom: 6px; }
.route-card .path b { color: var(--text); }
.route-card strong { color: var(--primary); font-size: 16px; }

.detail { display: flex; flex-direction: column; gap: 2px; }
.detail-row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--border); }
.detail-row span { color: var(--muted); }
.detail-row.total { font-size: 17px; border-bottom: 0; }
.timeline { margin-top: 6px; }
.timeline-item { display: flex; gap: 10px; padding: 7px 0; }
.timeline-item .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--primary); margin-top: 5px; flex: none; }
.timeline-item strong { display: block; font-size: 13px; }
.timeline-item small { color: var(--muted); }

.theme-picker { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.theme-option {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 14px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--surface-2); color: var(--text); font: inherit; cursor: pointer;
}
.theme-option.selected { border-color: var(--primary); box-shadow: 0 0 0 2px color-mix(in srgb, var(--primary) 25%, transparent); }

.empty { text-align: center; padding: 34px 16px; color: var(--muted); }
.empty h3 { color: var(--text); font-size: 15px; margin-bottom: 4px; }
.empty p { margin-bottom: 12px; }

/* ---------- Modal y notificaciones ---------- */
dialog {
    width: min(560px, calc(100vw - 32px));
    max-height: calc(100vh - 40px);
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: var(--surface);
    color: var(--text);
    box-shadow: 0 24px 70px rgba(0, 0, 0, .28);
}
dialog.wide { width: min(760px, calc(100vw - 32px)); }
dialog::backdrop { background: rgba(10, 20, 12, .55); backdrop-filter: blur(3px); }
.modal-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 18px 20px; border-bottom: 1px solid var(--border); }
.modal-head h2 { font-size: 17px; }
.modal-head p { color: var(--muted); margin-top: 4px; font-size: 13px; }
.modal-body { padding: 20px; overflow-y: auto; max-height: 60vh; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--border); background: var(--surface-2); }
.confirm-text { color: var(--muted); line-height: 1.6; }
#toasts { position: fixed; right: 18px; bottom: 18px; z-index: 100; display: flex; flex-direction: column; gap: 8px; }
.toast {
    min-width: 220px; max-width: 360px;
    padding: 12px 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
    border-left: 4px solid var(--ok);
    background: var(--surface);
    color: var(--text);
    box-shadow: var(--shadow);
    animation: slide .2s ease-out;
}
.toast.error { border-left-color: var(--danger); }
.toast.out { opacity: 0; transform: translateX(12px); transition: .25s; }
@keyframes slide { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: none; } }

/* ---------- Responsive ---------- */
@media (max-width: 1100px) {
    .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .form-grid.four { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .two-col { grid-template-columns: 1fr; }
}
@media (max-width: 820px) {
    .header-top { padding: 10px 16px; }
    .topnav { padding: 0 16px 8px; }
    .content { padding: 16px; }
    .section-head { flex-direction: column; }
    .kpi-grid, .kpi-grid.three, .form-grid.three, .route-result { grid-template-columns: 1fr; }
}
@media (max-width: 520px) {
    .form-grid, .form-grid.four, .theme-picker { grid-template-columns: 1fr; }
    .btn { padding: 8px 11px; }
    .field.align-end { justify-content: flex-start; }
}
    </style>
</head>

    <script type="module">
/* =========================================================
   ManguiTrack · estado, persistencia y lógica de negocio
   ========================================================= */

const STORAGE_KEY = "manguitrack.v1";
const THEME_KEY = "manguitrack.theme";

const now = () => new Date().toISOString();

function seedState() {
    const locations = [
        { id: "CEN", name: "Central", type: "central" },
        { id: "BN", name: "Bodega Norte", type: "bodega" },
        { id: "BS", name: "Bodega Sur", type: "bodega" },
        { id: "SS", name: "Suc. Soyapango", type: "sucursal" },
        { id: "SM", name: "Suc. San Miguel", type: "sucursal" },
        { id: "SA", name: "Suc. Santa Ana", type: "sucursal" }
    ];
    const skus = ["P01", "P02", "P03", "P04", "P05", "P06"];
    const stock = {};
    const filas = [
        [40, 80, 30, 120, 100, 60],
        [25, 30, 15, 50, 40, 5],
        [10, 45, 20, 30, 60, 25],
        [6, 12, 4, 20, 18, 9],
        [4, 8, 8, 15, 10, 3],
        [8, 10, 6, 12, 14, 7]
    ];
    locations.forEach((l, i) => {
        stock[l.id] = {};
        skus.forEach((s, j) => { stock[l.id][s] = filas[i][j]; });
    });
    return {
        version: 1,
        categories: [
            { id: "CAT1", name: "Frutas frescas", parentId: null },
            { id: "CAT2", name: "Tropicales", parentId: "CAT1" },
            { id: "CAT3", name: "Cítricos", parentId: "CAT1" },
            { id: "CAT4", name: "Procesados", parentId: null },
            { id: "CAT5", name: "Jugos", parentId: "CAT4" },
            { id: "CAT6", name: "Conservas", parentId: "CAT4" }
        ],
        providers: [
            { id: "PRV1", name: "Finca El Sol", contact: "ventas@fincaelsol.com" },
            { id: "PRV2", name: "Agro Cuscatlán", contact: "2222-1010" },
            { id: "PRV3", name: "Néctares SV", contact: "contacto@nectares.com" }
        ],
        products: [
            { sku: "P01", name: "Mango Tommy (caja)", categoryId: "CAT2", providerId: "PRV1", price: 12.5 },
            { sku: "P02", name: "Piña (unidad)", categoryId: "CAT2", providerId: "PRV1", price: 1.8 },
            { sku: "P03", name: "Limón (saco)", categoryId: "CAT3", providerId: "PRV2", price: 9 },
            { sku: "P04", name: "Jugo de mango 1L", categoryId: "CAT5", providerId: "PRV3", price: 2.2 },
            { sku: "P05", name: "Jugo de naranja 1L", categoryId: "CAT5", providerId: "PRV3", price: 2 },
            { sku: "P06", name: "Mermelada de mango", categoryId: "CAT6", providerId: "PRV3", price: 3.4 }
        ],
        locations,
        stock,
        clients: [
            { id: "C1", name: "Tienda La Esperanza", phone: "2222-0101" },
            { id: "C2", name: "Restaurante El Zonte", phone: "2222-0202" },
            { id: "C3", name: "Super Selectos Ilopango", phone: "2222-0303" },
            { id: "C4", name: "Comedor Doña Rosa", phone: "2222-0404" }
        ],
        edges: [
            { id: "R1", a: "CEN", b: "BN", km: 60 },
            { id: "R2", a: "CEN", b: "BS", km: 45 },
            { id: "R3", a: "CEN", b: "SS", km: 12 },
            { id: "R4", a: "BN", b: "SA", km: 40 },
            { id: "R5", a: "BN", b: "SS", km: 55 },
            { id: "R6", a: "BS", b: "SM", km: 70 },
            { id: "R7", a: "SS", b: "SM", km: 95 }
        ],
        sales: [], orders: [], movements: [],
        counters: { cat: 6, prv: 3, cli: 4, loc: 6, sale: 0, order: 0, mov: 0, route: 7 },
        undo: []
    };
}

function loadState() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
            const data = JSON.parse(raw);
            if (data?.version === 1 && Array.isArray(data.products) && Array.isArray(data.locations)) {
                return { ...data, undo: Array.isArray(data.undo) ? data.undo : [] };
            }
        }
    } catch (error) {
        console.warn("No se pudo restaurar la información guardada:", error);
    }
    return seedState();
}

let state = loadState();

/** Estado de la interfaz (no se persiste). */
const ui = {
    section: "resumen",
    cart: [],
    route: null,
    theme: localStorage.getItem(THEME_KEY) || "auto",
    filters: { productos: "", clientes: "", ventas: "", pedidos: "", bitacora: "", estado: "todos", tipo: "todos" }
};

/** Puente hacia la capa de interfaz, evita dependencias circulares. */
const hooks = { render() {}, toast() {} };

function saveState() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...state, undo: [] }));
    } catch (error) {
        hooks.toast("No se pudo guardar en este navegador.", "error");
    }
}

function logMov(type, detail, ref = "") {
    state.movements.unshift({
        id: "M" + (++state.counters.mov),
        date: now(), type, detail, ref
    });
}

/** Ejecuta una mutación con snapshot para deshacer, guardado y aviso. */
function transact(fn, message) {
    const before = JSON.stringify({ ...state, undo: [] });
    const result = fn();
    if (result === false) return false;
    state.undo.push(before);
    if (state.undo.length > 30) state.undo.shift();
    saveState();
    hooks.render();
    hooks.toast(typeof message === "function" ? message(result) : (message || "Cambios guardados"));
    return true;
}

function undo() {
    if (!state.undo.length) return hooks.toast("No hay operaciones para deshacer.", "error");
    const previous = state.undo.pop();
    const stack = state.undo;
    state = { ...JSON.parse(previous), undo: stack };
    saveState();
    hooks.render();
    hooks.toast("Se deshizo la última operación.");
}

function replaceState(data) {
    state = { ...data, undo: [] };
    saveState();
    hooks.render();
}

    }
    return false;
};

/* ---------- Grafo y rutas ---------- */
function graph() {
    const g = {};
    state.locations.forEach(l => { g[l.id] = {}; });
    state.edges.forEach(e => {
        if (g[e.a] && g[e.b]) { g[e.a][e.b] = e.km; g[e.b][e.a] = e.km; }
    });
    return g;
}

function dijkstra(a, b) {
    const g = graph();
    if (!g[a] || !g[b] || a === b) return null;
    const dist = {}, prev = {}, pending = new Set(Object.keys(g));
    Object.keys(g).forEach(k => { dist[k] = Infinity; });
    dist[a] = 0;
    while (pending.size) {
        let u = null;
        pending.forEach(k => { if (u === null || dist[k] < dist[u]) u = k; });
        if (u === null || dist[u] === Infinity) break;
        pending.delete(u);
        if (u === b) break;
        for (const [v, km] of Object.entries(g[u])) {
            const alt = dist[u] + km;
            if (alt < dist[v]) { dist[v] = alt; prev[v] = u; }
        }
    }
    if (dist[b] === Infinity) return null;
    const path = [];
    for (let x = b; x; x = prev[x]) { path.unshift(x); if (x === a) break; }
    return path[0] === a ? { km: dist[b], path } : null;
}

function bfs(a, b) {
    const g = graph();
    if (!g[a] || !g[b] || a === b) return null;
    const queue = [[a]], seen = new Set([a]);
    while (queue.length) {
        const path = queue.shift(), u = path[path.length - 1];
        if (u === b) return path;
        for (const v of Object.keys(g[u])) {
            if (!seen.has(v)) { seen.add(v); queue.push([...path, v]); }
        }
    }
    return null;
}

const routeText = path => (path || []).map(locName).join(" → ");

/* =========================================================
   ManguiTrack · componentes de interfaz reutilizables

let pendingSubmit = null;

const $ = selector => document.querySelector(selector);

function toast(message, kind = "ok") {
    const box = $("#toasts");
    if (!box) return;
    const el = document.createElement("div");
    el.className = `toast ${kind}`;
    el.setAttribute("role", kind === "error" ? "alert" : "status");
    el.textContent = message;
    box.append(el);
    setTimeout(() => {
        el.classList.add("out");
        setTimeout(() => el.remove(), 250);
    }, 3200);
}

function closeModal() {
    const modal = $("#modal");
    if (modal?.open) modal.close();
    if (modal) modal.innerHTML = "";
    pendingSubmit = null;
}

function fieldHTML(field, values = {}) {
    const value = values[field.key] ?? field.value ?? "";
    const attrs = `name="${esc(field.key)}" id="f-${esc(field.key)}" ${field.required ? "required" : ""} ${field.min !== undefined ? `min="${field.min}"` : ""} ${field.step ? `step="${field.step}"` : ""} ${field.max !== undefined ? `max="${field.max}"` : ""}`;
    let control;
    if (field.type === "select") {
        const options = (field.options || []).map(o =>
            `<option value="${esc(o.value)}" ${String(value) === String(o.value) ? "selected" : ""}>${esc(o.label)}</option>`
        ).join("");
        control = `<select ${attrs}>${options}</select>`;
    } else if (field.type === "textarea") {
        control = `<textarea ${attrs} rows="3" placeholder="${esc(field.placeholder || "")}">${esc(value)}</textarea>`;
    } else {
        control = `<input ${attrs} type="${field.type || "text"}" value="${esc(value)}" placeholder="${esc(field.placeholder || "")}">`;
    }
    return `<div class="field ${field.full ? "full" : ""}"><label for="f-${esc(field.key)}">${esc(field.label)}</label>${control}${field.hint ? `<small>${esc(field.hint)}</small>` : ""}</div>`;
}

function openForm({ title, subtitle, fields, values = {}, submit = "Guardar", onSubmit, wide = false }) {
    const modal = $("#modal");
    modal.className = wide ? "wide" : "";
    modal.innerHTML = `
        <div class="modal-head">
            <div><h2>${esc(title)}</h2>${subtitle ? `<p>${esc(subtitle)}</p>` : ""}</div>
            <button type="button" class="icon-btn" data-act="modal-close" aria-label="Cerrar">×</button>
        </div>
        <form id="modal-form">
            <div class="modal-body form-grid">${fields.map(f => fieldHTML(f, values)).join("")}</div>
            <div class="modal-foot">
                <button type="button" class="btn ghost" data-act="modal-close">Cancelar</button>
                <button type="submit" class="btn primary">${esc(submit)}</button>
            </div>
        </form>`;
    pendingSubmit = onSubmit;
    modal.showModal();
    modal.querySelector("input, select, textarea")?.focus();
}

function openConfirm(title, message, onConfirm, label = "Confirmar") {
    openForm({
        title,
        fields: [],
        submit: label,
        onSubmit: () => { onConfirm(); },
        values: {}
    });
    const body = $("#modal .modal-body");
    body.innerHTML = `<p class="confirm-text">${esc(message)}</p>`;
    $("#modal-form .btn.primary").classList.add("danger");
}

function handleModalSubmit(event) {
    if (event.target.id !== "modal-form") return;
    event.preventDefault();
    const data = Object.fromEntries(new FormData(event.target));
    const result = pendingSubmit?.(data);
    if (result === false) return;
    closeModal();
}

function badge(text, tone = "") {
    return `<span class="badge ${tone}">${esc(text)}</span>`;
}

function empty(icon, title, text, action = "") {
    return `<div class="empty"><h3>${esc(title)}</h3><p>${esc(text)}</p>${action}</div>`;
}

function table(heads, rows) {
    if (!rows.length) return "";
    return `<div class="table-wrap"><table>
        <thead><tr>${heads.map(h => `<th>${h}</th>`).join("")}</tr></thead>
        <tbody>${rows.join("")}</tbody>
    </table></div>`;
}

function sectionHead(title, subtitle, actions = "") {
    return `<div class="section-head"><div><h1>${esc(title)}</h1><p>${esc(subtitle)}</p></div><div class="head-actions">${actions}</div></div>`;
}

function panel(title, body, actions = "") {
    return `<section class="card"><div class="card-head"><h2>${esc(title)}</h2>${actions}</div>${body}</section>`;
}

function download(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function setTheme(theme) {
    ui.theme = theme;
    localStorage.setItem(THEME_KEY, theme);
    document.documentElement.dataset.theme = theme === "auto" ? "" : theme;
    if (theme === "auto") delete document.documentElement.dataset.theme;
}

function initTheme() {
    setTheme(ui.theme || "auto");
}

/* ---------- Inventario: entradas y salidas ---------- */
function invMovement(kind) {
    const locationId = document.getElementById("inv-loc")?.value;
    const sku = document.getElementById("inv-prod")?.value;
    const q = number(document.getElementById("inv-qty")?.value);
    const note = document.getElementById("inv-note")?.value.trim() || "";
    if (!locationId || !sku || !validQty(q)) return toast("La cantidad debe ser un entero mayor que cero.", "error");
    if (kind === "out" && stockOf(locationId, sku) < q) return toast("No hay existencias suficientes en esa ubicación.", "error");
    transact(() => {
        state.stock[locationId][sku] = stockOf(locationId, sku) + (kind === "in" ? q : -q);
        const tipo = kind === "in" ? "Entrada" : "Salida";
        logMov(tipo, `${tipo} de ${q} × ${prod(sku)?.name || sku} en ${locName(locationId)}${note ? ` · ${note}` : ""}`, sku);
    }, kind === "in" ? "Entrada registrada." : "Salida registrada.");
}

function newTransfer() {
    const from = document.getElementById("tr-from")?.value;
    const to = document.getElementById("tr-to")?.value;
    const sku = document.getElementById("tr-prod")?.value;
    const q = number(document.getElementById("tr-qty")?.value);
    if (!from || !to || !sku || !validQty(q)) return toast("Completa los datos con una cantidad válida.", "error");
    if (from === to) return toast("Origen y destino deben ser distintos.", "error");
    if (stockOf(from, sku) < q) return toast("Existencias insuficientes en el origen.", "error");
    const route = dijkstra(from, to);
    if (!route) return toast("No existe ruta entre esas ubicaciones.", "error");
    transact(() => {
        state.stock[from][sku] -= q;
        state.stock[to][sku] = stockOf(to, sku) + q;
        logMov("Transferencia", `${q} × ${prod(sku)?.name || sku}: ${routeText(route.path)} (${route.km} km)`, sku);
    }, `Transferencia realizada (${route.km} km).`);
}

/* ---------- Carrito compartido ---------- */
const FORM_IDS = ["sale-client", "sale-loc", "order-client", "order-dest", "route-from", "route-to"];

/** Redibuja el carrito sin perder las selecciones aún no guardadas. */
function renderKeepingForm() {
    const values = {};
    FORM_IDS.forEach(id => { const element = document.getElementById(id); if (element) values[id] = element.value; });
    hooks.render();
    Object.entries(values).forEach(([id, value]) => { const element = document.getElementById(id); if (element) element.value = value; });
}

function cartAdd() {
    const sku = document.getElementById("cart-product")?.value;
    const q = Number(document.getElementById("cart-qty")?.value);
    if (!sku || !Number.isInteger(q) || q <= 0) return toast("Elige un producto y una cantidad válida.", "error");
    const existing = ui.cart.find(i => i.sku === sku);
    if (existing) existing.qty += q;
    else ui.cart.push({ sku, qty: q });
    renderKeepingForm();
    toast(`${prod(sku)?.name || sku} agregado al carrito.`);
}

function cartRemove(sku) {
    ui.cart = ui.cart.filter(i => i.sku !== sku);
    renderKeepingForm();
}

function cartQtyChange(sku, value) {
    const q = Number(value);
    const item = ui.cart.find(i => i.sku === sku);
    if (!item) return;
    if (!Number.isInteger(q) || q <= 0) return toast("La cantidad debe ser un entero mayor que cero.", "error");
    item.qty = q;
    renderKeepingForm();
}

function clearCart() { ui.cart = []; }

/* ---------- Ventas ---------- */
function newSale() {
    if (!ui.cart.length) return toast("Agrega al menos un producto al carrito.", "error");
    const clientId = document.getElementById("sale-client")?.value;
    const locationId = document.getElementById("sale-loc")?.value;
    if (!clientId || !locationId) return toast("Selecciona cliente y ubicación.", "error");
    const needed = {};
    ui.cart.forEach(i => { needed[i.sku] = (needed[i.sku] || 0) + i.qty; });
    for (const [sku, qty] of Object.entries(needed)) {
        if (stockOf(locationId, sku) < qty) return toast(`Stock insuficiente de ${prod(sku)?.name || sku} en ${locName(locationId)}.`, "error");
    }
    transact(() => {
        const items = ui.cart.map(i => ({ sku: i.sku, name: prod(i.sku)?.name || i.sku, qty: i.qty, price: prod(i.sku)?.price || 0 }));
        const total = items.reduce((s, i) => s + i.qty * i.price, 0);
        const id = "V" + (++state.counters.sale);
        state.sales.unshift({ id, date: new Date().toISOString(), clientId, clientName: cliName(clientId), locationId, items, total });
        items.forEach(i => { state.stock[locationId][i.sku] -= i.qty; });
        logMov("Venta", `${id}: ${items.map(i => `${i.qty} × ${i.name}`).join(", ")} a ${cliName(clientId)} desde ${locName(locationId)}`, id);
        clearCart();
    }, "Venta registrada correctamente.");
}

        ${o.km ? `<div class="detail-row"><span>Ruta</span><strong>${esc(routeText(o.route))} · ${o.km} km</strong></div>` : ""}
        <table class="mini-table"><thead><tr><th>Producto</th><th>Cantidad</th></tr></thead><tbody>

    </div>`);
}

function dispatchOrder(id) {
    const o = state.orders.find(x => x.id === id);
    if (!o || o.status !== "pendiente") return;
    const candidates = state.locations.filter(l => l.type !== "sucursal" && o.items.every(i => stockOf(l.id, i.sku) >= i.qty))
        .map(l => ({ location: l, route: dijkstra(l.id, o.destination) }))
        .filter(x => x.route);
    if (!candidates.length) return toast("Ninguna bodega tiene todo el stock o no hay ruta al destino.", "error");
    candidates.sort((a, b) => a.route.km - b.route.km);
    openForm({
        title: `Despachar ${o.id}`,
        subtitle: `Destino: ${locName(o.destination)} · se sugiere la bodega más cercana con stock`,
        fields: [{ key: "origin", label: "Bodega de origen", type: "select",
            options: candidates.map(c => ({ value: c.location.id, label: `${c.location.name} · ${c.route.km} km` })) }],
        submit: "Confirmar despacho",
        onSubmit: d => {
            const chosen = candidates.find(c => c.location.id === d.origin);
            if (!chosen) return toast("Selecciona una bodega válida.", "error");
            transact(() => {
                o.items.forEach(i => {
                    state.stock[d.origin][i.sku] -= i.qty;
                    state.stock[o.destination][i.sku] = stockOf(o.destination, i.sku) + i.qty;
                });
                o.status = "despachado";
                o.origin = d.origin;
                o.route = chosen.route.path;
                o.km = chosen.route.km;
                o.dispatchedAt = new Date().toISOString();
                o.history.push({ status: "despachado", date: o.dispatchedAt, note: `Desde ${locName(d.origin)} · ${chosen.route.km} km` });
                logMov("Despacho", `${o.id}: desde ${locName(d.origin)} por ${routeText(chosen.route.path)} (${chosen.route.km} km)`, o.id);
            }, `${o.id} despachado desde ${locName(d.origin)}.`);
        }
    });
}

function deliverOrder(id) {
    const o = state.orders.find(x => x.id === id);
    if (!o || o.status !== "despachado") return;
    transact(() => {
        o.status = "entregado";
        o.deliveredAt = new Date().toISOString();
        o.history.push({ status: "entregado", date: o.deliveredAt, note: "Entrega confirmada" });
        logMov("Entrega", `${o.id} entregado en ${locName(o.destination)}`, o.id);
    }, "Entrega confirmada.");
}

function cancelOrder(id) {
    const o = state.orders.find(x => x.id === id);
    if (!o || ["entregado", "cancelado"].includes(o.status)) return;
    if (o.status === "despachado" && o.items.some(i => stockOf(o.destination, i.sku) < i.qty)) {
        return toast("No se puede cancelar: el destino ya consumió parte del stock despachado.", "error");
    }
    openConfirm("Cancelar pedido", `¿Cancelar ${o.id}?${o.status === "despachado" ? " El stock regresará a la bodega de origen." : ""}`, () => transact(() => {
        if (o.status === "despachado" && o.origin) {
            o.items.forEach(i => {
                state.stock[o.destination][i.sku] -= i.qty;
                state.stock[o.origin][i.sku] = stockOf(o.origin, i.sku) + i.qty;
            });
        }
        o.status = "cancelado";
        o.history.push({ status: "cancelado", date: new Date().toISOString(), note: "Pedido cancelado" });
        logMov("Cancelación", `${o.id} cancelado${o.origin ? ` · stock devuelto a ${locName(o.origin)}` : ""}`, o.id);
    }, "Pedido cancelado."), "Cancelar pedido");
}

/* ---------- Rutas y conexiones ---------- */
function calculateRoute() {
    const a = document.getElementById("route-from")?.value;
    const b = document.getElementById("route-to")?.value;
    if (!a || !b || a === b) return toast("Elige dos ubicaciones distintas.", "error");
    const short = dijkstra(a, b);
    const few = bfs(a, b);
    ui.route = `<div class="route-result">
        ${short ? `<div class="route-card"><h3> Menor distancia (Dijkstra)</h3><p class="path">${short.path.map(x => `<b>${esc(locName(x))}</b>`).join(" → ")}</p><strong>${short.km} km</strong></div>` : ""}
        ${few ? `<div class="route-card"><h3> Menos tramos (BFS)</h3><p class="path">${few.map(x => `<b>${esc(locName(x))}</b>`).join(" → ")}</p><strong>${few.length - 1} tramo(s)</strong></div>` : ""}
        ${!short && !few ? `<p class="muted">No hay ruta disponible entre esas ubicaciones.</p>` : ""}
    </div>`;
    hooks.render();
}

function edgeFields(a = "", b = "") {
    return [
        { key: "a", label: "Desde", type: "select", options: state.locations.map(l => ({ value: l.id, label: l.name })), value: a },
        { key: "b", label: "Hasta", type: "select", options: state.locations.map(l => ({ value: l.id, label: l.name })), value: b },
        { key: "km", label: "Distancia (km)", type: "number", min: 1, step: "1", required: true, full: true }
    ];
}

function newEdge() {
    openForm({ title: "Nueva conexión", fields: edgeFields(), submit: "Crear conexión", onSubmit: d => {
        if (d.a === d.b) return toast("Elige dos ubicaciones distintas.", "error");
        if (state.edges.some(e => (e.a === d.a && e.b === d.b) || (e.a === d.b && e.b === d.a))) return toast("Esa conexión ya existe.", "error");
        transact(() => {
            state.edges.push({ id: "R" + (++state.counters.route), a: d.a, b: d.b, km: Number(d.km) });
            logMov("Conexión", `Se agregó ${locName(d.a)} ↔ ${locName(d.b)} (${d.km} km)`, d.a);
        }, "Conexión creada.");
    } });
}

function editEdge(id) {
    const e = state.edges.find(x => x.id === id);
    if (!e) return;
    openForm({ title: "Editar conexión", subtitle: `${locName(e.a)} ↔ ${locName(e.b)}`, fields: edgeFields(e.a, e.b).filter(f => f.key === "km"), values: { km: e.km }, onSubmit: d => {
        transact(() => {
            e.km = Number(d.km);
            logMov("Conexión", `Se actualizó ${locName(e.a)} ↔ ${locName(e.b)} (${e.km} km)`, e.a);
        }, "Distancia actualizada.");
    } });
}

function deleteEdge(id) {
    const e = state.edges.find(x => x.id === id);
    if (!e) return;
    openConfirm("Eliminar conexión", `¿Eliminar el tramo ${locName(e.a)} ↔ ${locName(e.b)} (${e.km} km)?`, () => transact(() => {
        state.edges = state.edges.filter(x => x.id !== id);
        logMov("Conexión", `Se eliminó ${locName(e.a)} ↔ ${locName(e.b)}`, e.a);
    }, "Conexión eliminada."), "Eliminar");
}

function exportJSON() {

    toast("Respaldo descargado.");
}

function importClick() { document.getElementById("import-file")?.click(); }

function importFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
        let data;
        try { data = JSON.parse(reader.result); } catch { return toast("El archivo no es un JSON válido.", "error"); }
        if (data?.version !== 1 || !Array.isArray(data.products) || !Array.isArray(data.locations)) return toast("El respaldo no es compatible.", "error");
        openConfirm("Importar respaldo", "Se reemplazarán todos los datos actuales con los del archivo seleccionado.", () => {
            replaceState(data);
            toast("Respaldo importado correctamente.");
        }, "Importar");
    };
    reader.readAsText(file);
}

   ========================================================= */



const GROUPS = [
    { label: "General", items: [["resumen", "Resumen"]] },
    { label: "Catálogos", items: [
        ["productos", "Productos"], ["categorias", "Categorías"],
        ["proveedores", "Proveedores"], ["clientes", "Clientes"],
        ["ubicaciones", "Ubicaciones"]
    ] },
    { label: "Operación", items: [
        ["inventario", "Inventario"], ["transferencias", "Transferencias"],
        ["ventas", "Ventas"], ["pedidos", "Pedidos"],
        ["entregas", "Entregas"]
    ] },
    { label: "Logística", items: [["rutas", "Rutas y conexiones"]] },
    { label: "Auditoría", items: [["bitacora", "Bitácora"], ["ajustes", "Ajustes"]] }
];

const TITLES = Object.fromEntries(GROUPS.flatMap(g => g.items));

const itemCount = id => id === "pedidos" ? pedidosPendientes().length
    : id === "entregas" ? entregasActivas().length : 0;

function nav() {
    return GROUPS.map(group => {
        const active = group.items.some(([id]) => id === ui.section);
        const count = group.items.reduce((sum, [id]) => sum + itemCount(id), 0);
        return `<div class="nav-group ${active ? "active" : ""}">
            <button class="nav-trigger" aria-haspopup="true" title="Mostrar opciones de ${esc(group.label)}">
                ${esc(group.label)}${count ? `<span class="nav-count">${count}</span>` : ""}<span class="nav-caret" aria-hidden="true"></span>
            </button>
            <div class="nav-menu">
                ${group.items.map(([id, label]) => `<button class="nav-item ${ui.section === id ? "active" : ""}" data-act="nav" data-section="${id}">
                    ${esc(label)}${itemCount(id) ? `<span class="nav-count">${itemCount(id)}</span>` : ""}
                </button>`).join("")}
            </div>
        </div>`;
    }).join("");
}

function header() {
    const current = TITLES[ui.section] || "Resumen";
    const themeLabel = { auto: "Auto", light: "Claro", dark: "Oscuro" }[ui.theme] || "Auto";
    return `<header class="app-header">
        <div class="header-top">
            <div class="brand"><div class="brand-mark">M</div><div><strong>ManguiTrack</strong><small>Los Manguitos · Chivo NET</small></div></div>
            <div class="header-actions">
                <span class="current-page">${esc(current)}</span>
                <button class="btn ghost sm" data-act="undo">Deshacer</button>
                <button class="btn ghost sm" data-act="theme">Tema: ${themeLabel}</button>
            </div>
        </div>
        <nav class="topnav" aria-label="Navegación principal">${nav()}</nav>
    </header>`;
}

function render() {
    document.getElementById("app").innerHTML = `${header()}<main class="content">${view()}</main>`;
}

function view() {
    switch (ui.section) {
        case "resumen": return viewResumen();
        case "productos": return viewProductos();
        case "categorias": return viewCategorias();
        case "proveedores": return viewProveedores();
        case "clientes": return viewClientes();
        case "ubicaciones": return viewUbicaciones();
        case "inventario": return viewInventario();
        case "transferencias": return viewTransferencias();
        case "rutas": return renderLogistica();
        default:
            return ["ventas", "pedidos", "entregas"].includes(ui.section)
                ? renderOperacion(ui.section)
                : renderAuditoria(ui.section);
    }
}

/* ---------- Categorías ---------- */
function categoryStock(id) {
    const direct = state.products.filter(p => p.categoryId === id).reduce((s, p) => s + totalStock(p.sku), 0);
    return direct + state.categories.filter(c => c.parentId === id).reduce((s, c) => s + categoryStock(c.id), 0);
}
function categoryRows(parentId = null, level = 0) {
    return state.categories.filter(c => c.parentId === parentId).flatMap(c => {
        const count = state.products.filter(p => p.categoryId === c.id).length;
        const row = `<tr>
            <td style="padding-left:${12 + level * 20}px">${level ? "└ " : ""}<strong>${esc(c.name)}</strong></td>
            <td>${count} producto(s)</td>
            <td class="right">${categoryStock(c.id).toLocaleString("es-SV")} uds</td>
            <td class="row-actions">
                <button class="icon-btn" data-act="add-subcategory" data-id="${esc(c.id)}" title="Agregar subcategoría">+</button>
                <button class="icon-btn" data-act="edit-category" data-id="${esc(c.id)}" title="Editar">Editar</button>
                <button class="icon-btn danger" data-act="delete-category" data-id="${esc(c.id)}" title="Eliminar">×</button>
            </td></tr>`;
        return [row, ...categoryRows(c.id, level + 1)];
    });
}

        .map(m => `<tr><td>${esc(fmtDateTime(m.date))}</td><td>${esc(m.detail)}</td><td><span class="mono">${esc(m.ref || "—")}</span></td></tr>`);
    return `${sectionHead("Transferencias", "Mueve stock entre bodegas y sucursales calculando la ruta")}
        ${panel("Nueva transferencia", `<div class="form-grid four">
            <div class="field"><label for="tr-from">Origen</label><select id="tr-from">${locOptions}</select></div>
            <div class="field"><label for="tr-to">Destino</label><select id="tr-to">${locOptions}</select></div>
            <div class="field"><label for="tr-prod">Producto</label><select id="tr-prod">${prodOptions}</select></div>
            <div class="field"><label for="tr-qty">Cantidad</label><input id="tr-qty" type="number" min="1" value="1"></div>
        </div><div class="form-actions"><button class="btn primary" data-act="new-transfer">Transferir</button></div>`)}
        ${panel("Últimas transferencias", table(["Fecha", "Detalle", "Referencia"], historial) || empty("", "Sin transferencias", "Las transferencias aparecerán aquí."))}`;
}

/* =========================================================
   ManguiTrack · punto de entrada y eventos globales
   ========================================================= */





hooks.render = render;
hooks.toast = toast;

const simple = {
    "undo": undo,
    "modal-close": closeModal,
    "new-product": newProduct,
    "new-category": () => newCategory(),
    "new-provider": newProvider,
    "new-client": newClient,
    "new-location": newLocation,
    "new-transfer": newTransfer,
    "inv-in": () => invMovement("in"),
    "inv-out": () => invMovement("out"),
    "cart-add": cartAdd,
    "new-sale": newSale,
    "new-order": newOrder,
    "calculate-route": calculateRoute,
    "new-edge": newEdge,
    "export-csv": exportCSV,
    "export-json": exportJSON,
    "import-click": importClick,
    "reset-demo": resetDemo
};

const byId = {
    "edit-product": editProduct, "delete-product": deleteProduct,
    "edit-category": editCategory, "delete-category": deleteCategory,
    "add-subcategory": newCategory,
    "edit-provider": editProvider, "delete-provider": deleteProvider,
    "edit-client": editClient, "delete-client": deleteClient,
    "edit-location": editLocation, "delete-location": deleteLocation,
    "cart-remove": cartRemove,
    "sale-detail": saleDetail,
    "order-detail": orderDetail, "order-dispatch": dispatchOrder,
    "order-deliver": deliverOrder, "order-cancel": cancelOrder,
    "edit-edge": editEdge, "delete-edge": deleteEdge
};

document.addEventListener("click", event => {
    const target = event.target.closest("[data-act]");
    if (!target) return;
    const action = target.dataset.act;
    if (action === "nav") {
        ui.section = target.dataset.section;
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
        return;
    }
    if (action === "theme") {
        const order = ["auto", "light", "dark"];
        setThemeAction(order[(order.indexOf(ui.theme) + 1) % order.length]);
        return;
    }
    if (action === "set-theme") { setThemeAction(target.dataset.theme); return; }
    if (simple[action]) { simple[action](); return; }
    if (byId[action]) { byId[action](target.dataset.id); return; }
});

document.addEventListener("input", event => {
    const key = event.target.dataset.filter;
    if (!key) return;
    ui.filters[key] = event.target.value;
    const caret = event.target.selectionStart;
    render();
    const again = document.querySelector(`[data-filter="${key}"]`);
    if (again) { again.focus(); if (caret !== null) again.setSelectionRange(caret, caret); }
});

document.addEventListener("change", event => {
    const target = event.target;
    if (target.dataset.filter) {
        ui.filters[target.dataset.filter] = target.value;
        render();
        return;
    }
    if (target.dataset.cartQty) return cartQtyChange(target.dataset.cartQty, target.value);
    if (target.id === "import-file") return importFile(target.files?.[0]);
});

document.addEventListener("submit", handleModalSubmit);

const modal = document.getElementById("modal");
modal.addEventListener("click", event => { if (event.target === modal) closeModal(); });

initTheme();
render();
    </script>
</body>

</html>
